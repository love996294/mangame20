<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>是男人就撑过20秒 - 弹幕躲避</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #08080c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 600px;
            height: 800px;
            max-width: 98vw;
            max-height: 96vh;
            aspect-ratio: 3 / 4;
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.2);
            border: 2px solid #1f2937;
            border-radius: 8px;
            overflow: hidden;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 2.4rem;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }
        .subtitle {
            color: #9ca3af;
            font-size: 0.95rem;
            max-width: 420px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .highlight {
            color: #38bdf8;
            font-weight: bold;
        }
        .result-box {
            background: rgba(31, 41, 55, 0.7);
            border: 1px solid #374151;
            padding: 20px 40px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .time-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: #facc15;
            font-variant-numeric: tabular-nums;
            margin: 8px 0;
        }
        .rank-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e5e7eb;
        }
        button {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }
        button:active {
            transform: translateY(1px);
        }
        .legend {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: #d1d5db;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="600" height="800"></canvas>

    <!-- 开始界面 -->
    <div id="start-screen" class="overlay">
        <h1>是男人就撑过20秒</h1>
        <p class="subtitle">
            驾驶战机在密集的弹幕中生存。<br>
            <span class="highlight">键盘操作：</span>方向键 / WASD 移动，按住 <span class="highlight">Shift</span> 减速微操<br>
            <span class="highlight">鼠标/触屏：</span>按住并拖动战机移动<br>
            （注：只有战机中心发光的<span class="highlight">蓝色圆点</span>会被击中）
        </p>
        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:#facc15;"></span> 0s 散弹</div>
            <div class="legend-item"><span class="dot" style="background:#ef4444;"></span> 5s 狙击弹</div>
            <div class="legend-item"><span class="dot" style="background:#c084fc;"></span> 10s 爆裂弹</div>
            <div class="legend-item"><span class="dot" style="background:#2dd4bf;"></span> 15s 波浪弹</div>
        </div>
        <button id="start-btn">开始挑战</button>
    </div>

    <!-- 结束界面 -->
    <div id="gameover-screen" class="overlay hidden">
        <h1 id="gameover-title">挑战失败</h1>
        <div class="result-box">
            <div style="color: #9ca3af; font-size: 0.9rem;">生存时间</div>
            <div id="final-time" class="time-display">0.00s</div>
            <div id="rank-eval" class="rank-text">评价加载中...</div>
        </div>
        <button id="restart-btn">再来一次</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const finalTimeEl = document.getElementById('final-time');
const rankEvalEl = document.getElementById('rank-eval');
const gameoverTitleEl = document.getElementById('gameover-title');

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

// 游戏状态变量
let gameState = 'START'; // START, PLAYING, GAMEOVER
let elapsedTime = 0;
let lastFrameTime = 0;
let passed20sBannerTimer = 0;
let reached20s = false;

// 玩家战机属性
const player = {
    x: WIDTH / 2,
    y: HEIGHT * 0.75,
    hitboxRadius: 4.5, // 核心判定点半径（比视觉外观小，保证弹幕体验）
    baseSpeed: 320,
    slowSpeed: 150,
    isSlow: false
};

// 对象池
let bullets = [];
let spawners = []; // 用于延迟爆炸的母弹
let particles = [];
let stars = [];

// 刷怪计时器
let normalSpawnTimer = 0;
let sniperSpawnTimer = 0;
let novaSpawnTimer = 0;
let waveSpawnTimer = 0;

// 初始化星空背景
for (let i = 0; i < 80; i++) {
    stars.push({
        x: Math.random() * WIDTH,
        y: Math.random() * HEIGHT,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 120 + 40,
        alpha: Math.random() * 0.7 + 0.3
    });
}

// 输入控制监听
const keys = {};
let pointerActive = false;
let pointerX = 0;
let pointerY = 0;

window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

function updatePointerPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = WIDTH / rect.width;
    const scaleY = HEIGHT / rect.height;
    pointerX = (clientX - rect.left) * scaleX;
    pointerY = (clientY - rect.top) * scaleY;
}

canvas.addEventListener('mousedown', (e) => {
    if (gameState !== 'PLAYING') return;
    pointerActive = true;
    updatePointerPos(e.clientX, e.clientY);
});
window.addEventListener('mousemove', (e) => {
    if (!pointerActive) return;
    updatePointerPos(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => { pointerActive = false; });

canvas.addEventListener('touchstart', (e) => {
    if (gameState !== 'PLAYING') return;
    pointerActive = true;
    updatePointerPos(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
}, { passive: false });

window.addEventListener('touchmove', (e) => {
    if (!pointerActive || gameState !== 'PLAYING') return;
    updatePointerPos(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
}, { passive: false });

window.addEventListener('touchend', () => { pointerActive = false; });

// 辅助函数：从屏幕四边随机获取一个出生点
function getRandomEdgePoint() {
    const edge = Math.floor(Math.random() * 4);
    if (edge === 0) return { x: Math.random() * WIDTH, y: -15 }; // Top
    if (edge === 1) return { x: WIDTH + 15, y: Math.random() * HEIGHT }; // Right
    if (edge === 2) return { x: Math.random() * WIDTH, y: HEIGHT + 15 }; // Bottom
    return { x: -15, y: Math.random() * HEIGHT }; // Left
}

// 1. 生成普通散弹 (黄色)
function spawnNormalBullet() {
    const pos = getRandomEdgePoint();
    // 目标指向屏幕中心附近的随机区域
    const targetX = WIDTH * 0.2 + Math.random() * (WIDTH * 0.6);
    const targetY = HEIGHT * 0.2 + Math.random() * (HEIGHT * 0.6);
    const angle = Math.atan2(targetY - pos.y, targetX - pos.x);
    const speed = 150 + Math.random() * 120 + Math.min(elapsedTime * 3, 100);

    bullets.push({
        type: 'normal',
        x: pos.x,
        y: pos.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: 5.5,
        color: '#facc15'
    });
}

// 2. 生成自机狙快弹 (红色)
function spawnSniperBullet() {
    const pos = getRandomEdgePoint();
    const angle = Math.atan2(player.y - pos.y, player.x - pos.x);
    const speed = 340 + Math.min(elapsedTime * 4, 150);

    bullets.push({
        type: 'sniper',
        x: pos.x,
        y: pos.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: 4.5,
        color: '#ef4444'
    });
}

// 3. 生成爆裂母弹 (紫色)
function spawnNovaOrb() {
    const x = 80 + Math.random() * (WIDTH - 160);
    const y = -15;
    spawners.push({
        x: x,
        y: y,
        vy: 140,
        timer: 1.0 + Math.random() * 0.6, // 移动1~1.6秒后爆炸
        radius: 10,
        color: '#c084fc'
    });
}

// 4. 生成正弦波浪弹幕 (青色)
function spawnWaveBullets() {
    const count = 4;
    const spacing = WIDTH / count;
    const offset = (Math.random() - 0.5) * 60;
    for (let i = 0; i < count; i++) {
        const startX = spacing * (i + 0.5) + offset;
        bullets.push({
            type: 'wave',
            x: startX,
            baseX: startX,
            y: -10,
            vx: 0,
            vy: 190,
            age: 0,
            amplitude: 45,
            frequency: 4.5,
            radius: 5.5,
            color: '#2dd4bf'
        });
    }
}

// 产生爆炸粒子
function createExplosion(x, y, color, count = 35) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 260 + 40;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: Math.random() * 3.5 + 1.5,
            color: color,
            alpha: 1,
            decay: Math.random() * 0.9 + 0.4
        });
    }
}

// 重置并开始游戏
function startGame() {
    player.x = WIDTH / 2;
    player.y = HEIGHT * 0.75;
    bullets = [];
    spawners = [];
    particles = [];
    elapsedTime = 0;
    normalSpawnTimer = 0;
    sniperSpawnTimer = 0;
    novaSpawnTimer = 0;
    waveSpawnTimer = 0;
    reached20s = false;
    passed20sBannerTimer = 0;
    pointerActive = false;

    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    gameState = 'PLAYING';
    lastFrameTime = performance.now();
}

// 触发游戏结束
function triggerGameOver() {
    gameState = 'GAMEOVER';
    createExplosion(player.x, player.y, '#38bdf8', 50);
    createExplosion(player.x, player.y, '#facc15', 25);

    const timeStr = elapsedTime.toFixed(2);
    finalTimeEl.textContent = timeStr + 's';

    let rank = '';
    if (elapsedTime < 5) {
        gameoverTitleEl.textContent = '瞬间蒸发';
        rank = '评级：【新手菜鸟】 还没反应过来就结束了？';
    } else if (elapsedTime < 10) {
        gameoverTitleEl.textContent = '挑战失败';
        rank = '评级：【初窥门径】 被高速狙击弹打了个措手不及。';
    } else if (elapsedTime < 15) {
        gameoverTitleEl.textContent = '挑战失败';
        rank = '评级：【小有实力】 已经能应对中等密度的火力网了！';
    } else if (elapsedTime < 20) {
        gameoverTitleEl.textContent = '功亏一篑';
        rank = '评级：【准王牌飞行员】 距离20秒仅一步之遥！';
    } else if (elapsedTime < 30) {
        gameoverTitleEl.textContent = '挑战成功！';
        rank = '评级：【真男人 / 铁血王牌】 成功撑过20秒魔鬼弹幕！';
    } else {
        gameoverTitleEl.textContent = '超越人类！';
        rank = '评级：【弹幕之神】 你的动态视力已经突破天际！';
    }
    rankEvalEl.textContent = rank;

    setTimeout(() => {
        gameoverScreen.classList.remove('hidden');
    }, 700);
}

// 更新游戏逻辑
function update(dt) {
    // 星空背景滚动
    for (let s of stars) {
        s.y += s.speed * dt;
        if (s.y > HEIGHT) {
            s.y = 0;
            s.x = Math.random() * WIDTH;
        }
    }

    // 更新爆炸粒子
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= p.decay * dt;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    if (gameState !== 'PLAYING') return;

    elapsedTime += dt;

    // 20秒达成提示触发
    if (!reached20s && elapsedTime >= 20.0) {
        reached20s = true;
        passed20sBannerTimer = 2.5; // 横幅显示2.5秒
    }
    if (passed20sBannerTimer > 0) {
        passed20sBannerTimer -= dt;
    }

    // --- 玩家移动控制 ---
    player.isSlow = keys['ShiftLeft'] || keys['ShiftRight'];
    const currentSpeed = player.isSlow ? player.slowSpeed : player.baseSpeed;

    let dx = 0;
    let dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;

    if (dx !== 0 || dy !== 0) {
        pointerActive = false; // 按下键盘时接管鼠标移动
        const len = Math.hypot(dx, dy);
        player.x += (dx / len) * currentSpeed * dt;
        player.y += (dy / len) * currentSpeed * dt;
    } else if (pointerActive) {
        const dist = Math.hypot(pointerX - player.x, pointerY - player.y);
        const maxMove = player.baseSpeed * 1.35 * dt;
        if (dist <= maxMove) {
            player.x = pointerX;
            player.y = pointerY;
        } else {
            const angle = Math.atan2(pointerY - player.y, pointerX - player.x);
            player.x += Math.cos(angle) * maxMove;
            player.y += Math.sin(angle) * maxMove;
        }
    }

    // 限制玩家在屏幕内
    const margin = 16;
    player.x = Math.max(margin, Math.min(WIDTH - margin, player.x));
    player.y = Math.max(margin, Math.min(HEIGHT - margin, player.y));

    // --- 弹幕生成调度 ---
    // 1. 普通散弹 (随时间加快频率，最高每秒约16颗)
    const normalInterval = Math.max(0.055, 0.22 - elapsedTime * 0.007);
    normalSpawnTimer += dt;
    while (normalSpawnTimer >= normalInterval) {
        normalSpawnTimer -= normalInterval;
        spawnNormalBullet();
    }

    // 2. 5秒后加入红色狙击弹
    if (elapsedTime >= 5.0) {
        const sniperInterval = Math.max(0.28, 0.85 - (elapsedTime - 5) * 0.025);
        sniperSpawnTimer += dt;
        if (sniperSpawnTimer >= sniperInterval) {
            sniperSpawnTimer -= sniperInterval;
            spawnSniperBullet();
        }
    }

    // 3. 10秒后加入紫色爆裂母弹
    if (elapsedTime >= 10.0) {
        const novaInterval = Math.max(1.4, 2.6 - (elapsedTime - 10) * 0.06);
        novaSpawnTimer += dt;
        if (novaSpawnTimer >= novaInterval) {
            novaSpawnTimer -= novaInterval;
            spawnNovaOrb();
        }
    }

    // 4. 15秒后加入青色波浪弹幕
    if (elapsedTime >= 15.0) {
        const waveInterval = Math.max(1.1, 1.8 - (elapsedTime - 15) * 0.03);
        waveSpawnTimer += dt;
        if (waveSpawnTimer >= waveInterval) {
            waveSpawnTimer -= waveInterval;
            spawnWaveBullets();
        }
    }

    // --- 更新爆裂母弹 ---
    for (let i = spawners.length - 1; i >= 0; i--) {
        let sp = spawners[i];
        sp.y += sp.vy * dt;
        sp.timer -= dt;

        // 检测母弹本体与玩家的碰撞
        if (Math.hypot(sp.x - player.x, sp.y - player.y) < sp.radius + player.hitboxRadius) {
            triggerGameOver();
            return;
        }

        // 倒计时结束，分裂成环形弹幕
        if (sp.timer <= 0) {
            const count = 14;
            const speed = 190;
            const baseAngle = Math.random() * Math.PI * 2;
            for (let j = 0; j < count; j++) {
                const angle = baseAngle + (Math.PI * 2 / count) * j;
                bullets.push({
                    type: 'nova',
                    x: sp.x,
                    y: sp.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 5,
                    color: '#c084fc'
                });
            }
            createExplosion(sp.x, sp.y, '#c084fc', 12);
            spawners.splice(i, 1);
        }
    }

    // --- 更新子弹与碰撞检测 ---
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        if (b.type === 'wave') {
            b.age += dt;
            b.y += b.vy * dt;
            b.x = b.baseX + Math.sin(b.age * b.frequency) * b.amplitude;
        } else {
            b.x += b.vx * dt;
            b.y += b.vy * dt;
        }

        // 移除飞出屏幕外的子弹
        if (b.x < -40 || b.x > WIDTH + 40 || b.y < -40 || b.y > HEIGHT + 40) {
            bullets.splice(i, 1);
            continue;
        }

        // 圆形碰撞检测
        const dist = Math.hypot(b.x - player.x, b.y - player.y);
        if (dist < b.radius + player.hitboxRadius) {
            triggerGameOver();
            return;
        }
    }
}

// 渲染画面
function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // 1. 绘制星空背景
    for (let s of stars) {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }

    // 2. 绘制背景大号实时计时器水印
    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        ctx.save();
        ctx.font = 'bold 95px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = elapsedTime >= 20 ? 'rgba(74, 222, 128, 0.12)' : 'rgba(255, 255, 255, 0.06)';
        ctx.fillText(elapsedTime.toFixed(2), WIDTH / 2, HEIGHT / 2);
        ctx.restore();
    }

    // 3. 绘制紫色母弹
    for (let sp of spawners) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.radius, 0, Math.PI * 2);
        ctx.fillStyle = sp.color;
        ctx.shadowColor = sp.color;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.restore();
    }

    // 4. 绘制所有子弹
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        // 子弹高光内芯（增强视觉清晰度）
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
    }

    // 5. 绘制玩家战机
    if (gameState === 'PLAYING') {
        ctx.save();
        ctx.translate(player.x, player.y);

        // 引擎尾焰
        ctx.beginPath();
        ctx.moveTo(-6, 14);
        ctx.lineTo(0, 24 + Math.random() * 8);
        ctx.lineTo(6, 14);
        ctx.fillStyle = '#f97316';
        ctx.fill();

        // 战机外轮廓
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(15, 14);
        ctx.lineTo(5, 9);
        ctx.lineTo(0, 14);
        ctx.lineTo(-5, 9);
        ctx.lineTo(-15, 14);
        ctx.closePath();
        ctx.fillStyle = '#e2e8f0';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();

        // 核心碰撞判定点（发光圆心）
        ctx.beginPath();
        ctx.arc(0, 0, player.hitboxRadius, 0, Math.PI * 2);
        ctx.fillStyle = player.isSlow ? '#ef4444' : '#0ea5e9';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // 按住 Shift 减速时显示判定外环
        if (player.isSlow) {
            ctx.beginPath();
            ctx.arc(0, 0, player.hitboxRadius + 5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        ctx.restore();
    }

    // 6. 绘制爆炸粒子
    for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
    }

    // 7. 顶部 HUD 信息栏
    if (gameState === 'PLAYING') {
        ctx.save();
        ctx.font = 'bold 22px monospace';
        ctx.fillStyle = elapsedTime >= 20 ? '#4ade80' : '#facc15';
        ctx.fillText(`TIME: ${elapsedTime.toFixed(2)}s`, 18, 34);

        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#9ca3af';
        ctx.textAlign = 'right';
        let stageText = '阶段1: 散弹袭来';
        if (elapsedTime >= 15) stageText = '阶段4: 终极狂暴弹幕';
        else if (elapsedTime >= 10) stageText = '阶段3: 环形爆裂弹解锁';
        else if (elapsedTime >= 5) stageText = '阶段2: 高速狙击弹解锁';
        ctx.fillText(stageText, WIDTH - 18, 32);

        // 20秒达成横幅提示
        if (passed20sBannerTimer > 0) {
            ctx.textAlign = 'center';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillStyle = '#4ade80';
            ctx.shadowColor = '#16a34a';
            ctx.shadowBlur = 10;
            ctx.fillText('★ 20秒达成！继续挑战极限！ ★', WIDTH / 2, 90);
        }
        ctx.restore();
    }
}

// 游戏主循环
function gameLoop(timestamp) {
    if (!lastFrameTime) lastFrameTime = timestamp;
    let dt = (timestamp - lastFrameTime) / 1000;
    lastFrameTime = timestamp;

    // 防止切换标签页导致 dt 过大出现瞬移
    if (dt > 0.1) dt = 0.1;

    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

// 绑定按钮事件与启动循环
startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
requestAnimationFrame(gameLoop);
</script>
